<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCU Registration Search</title>
<style>
  :root{
    --bg:#000000;
    --panel:#0c0f0e;
    --panel-border:#1c2622;
    --accent:#2ee6a8;
    --accent-glow:rgba(46,230,168,0.35);
    --text:#f2f5f4;
    --muted:#6b7d76;
    --row-alt:#0a0d0c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Space Mono', 'DejaVu Sans Mono', 'Consolas', ui-monospace, monospace;
    font-weight:700;
    background:var(--bg);
    color:var(--text);
    background-image: radial-gradient(circle, #141a17 1px, transparent 1px);
    background-size: 26px 26px;
  }
  header{
    background:#000;
    padding:22px 16px 10px;
    text-align:left;
    border-bottom:1px solid var(--panel-border);
  }
  header h1{
    margin:0;
    font-size:1.1rem;
    letter-spacing:2px;
    color:var(--accent);
    text-transform:uppercase;
    font-weight:600;
  }
  header p{
    margin:6px 0 0;
    font-size:0.78rem;
    color:var(--muted);
  }
  .search-wrap{
    padding:14px 16px;
    background:#000;
    position:sticky;
    top:0;
    z-index:9;
    border-bottom:1px solid var(--panel-border);
  }
  #searchBox{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--panel-border);
    background:var(--panel);
    color:var(--text);
    font-size:1rem;
    font-family:inherit;
    outline:none;
  }
  #searchBox:focus{
    border-color:var(--accent);
    box-shadow:0 0 12px var(--accent-glow);
  }
  .status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 16px;
    font-size:0.75rem;
    color:var(--muted);
    background:#000;
  }
  #refreshBtn{
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--accent);
    padding:5px 12px;
    border-radius:8px;
    font-size:0.72rem;
    font-family:inherit;
    cursor:pointer;
  }
  .table-wrap{
    overflow-x:auto;
    padding:0 8px 24px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:100%;
    table-layout:auto;
  }
  .serial-col{ color:var(--muted); width:45px; text-align:left; }
  .reg-col{ font-weight:700; color:#eafff5; width:150px; }
  thead th{
    background:#000;
    color:var(--accent);
    padding:12px 8px;
    text-align:left;
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    border-bottom:1px solid var(--panel-border);
  }
  tbody td{
    padding:12px 8px;
    border-bottom:1px solid var(--panel-border);
    font-size:0.92rem;
    font-weight:700;
  }
  tbody tr:nth-child(even){
    background:var(--row-alt);
  }
  tbody tr:hover{
    background:#101917;
  }
  mark{
    background:var(--accent);
    color:#00120c;
    padding:0 2px;
    border-radius:3px;
  }
  .empty-msg, .loading-msg, .error-msg{
    text-align:center;
    padding:40px 16px;
    color:var(--muted);
  }
  .error-msg{ color:#ff8a80; }
  footer{
    text-align:center;
    padding:16px;
    font-size:0.7rem;
    color:var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>DCU Registration List</h1>
  <p>Live data synced from Google Sheets</p>
</header>

<div class="search-wrap">
  <input type="text" id="searchBox" placeholder="Search by serial, registration number, or name...">
</div>

<div class="status-bar">
  <span id="statusText">Loading data...</span>
  <button id="refreshBtn">Refresh</button>
</div>

<div class="table-wrap">
  <table id="dataTable">
    <thead>
      <tr>
        <th class="serial-col">S/N</th>
        <th class="reg-col">DCU Registration</th>
        <th>Name</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="3" class="loading-msg">Fetching data...</td></tr>
    </tbody>
  </table>
</div>

<footer>Data source: Google Sheets · Auto-refreshes on load</footer>

<script>
  // ==== CONFIGURATION ====
  const SHEET_ID = "1jvuX_lRXQgh4a0-2nQMsQKY92nZXi6lCe8UD_RnN0WY";
  const SHEET_NAME = "arranged"; // pulls from the "arranged" tab specifically, not "raw"
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  // ========================

  let allRows = [];

  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field+='"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else{ field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n' || c === '\r'){
          if(field.length || row.length){ row.push(field); rows.push(row); }
          field=''; row=[];
          if(c === '\r' && next === '\n') i++;
        } else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function render(rows){
    const tbody = document.getElementById('tableBody');
    if(!rows.length){
      tbody.innerHTML = `<tr><td colspan="3" class="empty-msg">No matching records found.</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td class="serial-col">${i + 1}</td>
        <td class="reg-col">${r[1] ?? ''}</td>
        <td>${r[2] ?? ''}</td>
      </tr>
    `).join('');
  }

  function highlight(text, term){
    if(!term) return text;
    const idx = text.toLowerCase().indexOf(term.toLowerCase());
    if(idx === -1) return text;
    return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+term.length) + '</mark>' + text.slice(idx+term.length);
  }

  function applySearch(){
    const term = document.getElementById('searchBox').value.trim();
    if(!term){
      render(allRows);
      document.getElementById('statusText').textContent = `${allRows.length} records loaded`;
      return;
    }
    const t = term.toLowerCase();
    const filtered = allRows.filter(r =>
      r.some(cell => (cell || '').toLowerCase().includes(t))
    );
    const highlighted = filtered.map(r => r.map(cell => highlight(cell || '', term)));
    render(highlighted);
    document.getElementById('statusText').textContent = `${filtered.length} of ${allRows.length} records match`;
  }

  async function loadData(){
    document.getElementById('statusText').textContent = 'Loading data...';
    try {
      const res = await fetch(CSV_URL + '&_=' + Date.now());
      if(!res.ok) throw new Error('Network response was not ok');
      const text = await res.text();
      const parsed = parseCSV(text);
      // Drop header row, keep rows that have a registration number
      allRows = parsed.slice(1).filter(r => r[1] && r[1].trim() !== '');
      applySearch();
    } catch(err){
      document.getElementById('tableBody').innerHTML =
        `<tr><td colspan="3" class="error-msg">Failed to load data. Make sure the sheet is published to the web.<br>${err.message}</td></tr>`;
      document.getElementById('statusText').textContent = 'Error loading data';
    }
  }

  document.getElementById('searchBox').addEventListener('input', applySearch);
  document.getElementById('refreshBtn').addEventListener('click', loadData);

  loadData();
</script>

</body>
</html>
